<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #e5e5e5; }

/* Header */
.header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid #1f1f1f;
}
.header h1 {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header h1 svg { color: #3b82f6; }
.header p { font-size: 11px; color: #737373; margin-top: 4px; }

/* Status card */
.status-card {
  margin: 14px 16px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #1f1f1f;
  background: #111;
}
.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
.status-row + .status-row { margin-top: 8px; }
.ig-preview {
  margin: 0 16px 12px;
  padding: 12px 14px;
  border-radius: 10px;
  background: #1c1c1c;
  border: 1px solid #333;
}
.ig-preview-line { color: #e5e5e5; font-size: 13px; font-weight: 500; }
.ig-preview-note { color: #737373; font-size: 11px; margin-top: 4px; line-height: 1.4; }
.ig-preview .actions { margin-top: 10px; padding: 0; }
.status-label { color: #737373; }
.status-value { color: #e5e5e5; font-weight: 500; }
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 6px;
}
.dot-green { background: #22c55e; }
.dot-red { background: #ef4444; }
.dot-yellow { background: #eab308; }

/* Actions */
.actions {
  padding: 0 16px 14px;
  display: flex;
  gap: 8px;
}
.btn {
  flex: 1;
  padding: 9px 12px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-primary {
  background: #3b82f6;
  color: #fff;
}
.btn-primary:hover { background: #2563eb; }
.btn-primary:disabled { background: #1e3a5f; color: #5b8dd4; cursor: not-allowed; }
.btn-secondary {
  background: #1f1f1f;
  color: #d4d4d4;
}
.btn-secondary:hover { background: #2a2a2a; }
</style>
</head>
<body>

<div class="header">
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    Social Saver Pro
  </h1>
  <p>Save, categorize &amp; act on your X bookmarks</p>
</div>

<div class="status-card">
  <div class="status-row">
    <span class="status-label">Connection</span>
    <span class="status-value" id="conn-status">
      <span class="status-dot dot-yellow" id="conn-dot"></span>
      <span id="conn-text">Checking...</span>
    </span>
  </div>
  <div class="status-row" id="pending-row" hidden>
    <span class="status-label">Waiting to sync</span>
    <span class="status-value" id="pending-count">0</span>
  </div>
  <div class="status-row">
    <span class="status-label">Archive</span>
    <span class="status-value" id="archive-summary">—</span>
  </div>
  <div class="status-row" id="download-row" hidden>
    <span class="status-label">Downloading</span>
    <span class="status-value" id="download-progress">—</span>
  </div>
  <div class="status-row">
    <span class="status-label">Last sync</span>
    <span class="status-value" id="last-sync">Never</span>
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" id="sync-btn" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="23 4 23 10 17 10"/>
      <polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Sync Now
  </button>
  <button class="btn btn-secondary" id="dashboard-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
    </svg>
    Dashboard
  </button>
</div>

<div class="actions">
  <button class="btn btn-secondary" id="ig-sync-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
    </svg>
    Sync Instagram
  </button>
</div>

<div class="ig-preview" id="ig-preview" hidden>
  <div class="ig-preview-line" id="ig-preview-summary"></div>
  <div class="ig-preview-note" id="ig-preview-note"></div>
  <div class="actions">
    <button class="btn btn-primary" id="ig-confirm-btn">Download</button>
    <button class="btn btn-secondary" id="ig-cancel-btn">Cancel</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
